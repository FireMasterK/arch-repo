# Startup smoke test settings, sourced by scripts/smoke-runner.sh.
# Native Qt 6 client: wait for its Wayland surface, owned by app id "lightning".
SMOKE_WAYLAND=true
SMOKE_TIMEOUT=120
SMOKE_WINDOW_PATTERN='top-level window .* of lightning,'
SMOKE_PROCESS_PATTERN='lightning-matrix --backend=rust'
SMOKE_CMD=(
  env QT_QPA_PLATFORM=wayland
  lightning-matrix --backend=rust
)
