# Startup smoke test settings, sourced by scripts/smoke-runner.sh.
# Native GPUI client: wait for its Wayland surface, owned by app id "gitcomet".
SMOKE_WAYLAND=true
SMOKE_TIMEOUT=90
SMOKE_WINDOW_PATTERN='top-level window .* of gitcomet,'
# GPUI's Wayland preflight requires wl_seat; Weston's headless backend only
# advertises one with --fake-seat.
SMOKE_WESTON_ARGS=(--fake-seat)
SMOKE_CMD=(gitcomet)
