# Startup smoke test settings, sourced by scripts/smoke-runner.sh.
# CLI package: no window to wait for, so just run the Valgrind binary. The
# expected string proves it is CodSpeed's fork, not the distro valgrind.
SMOKE_WAYLAND=false
SMOKE_CMD=(valgrind --version)
SMOKE_EXPECT_OUTPUT='codspeed'
SMOKE_TIMEOUT=30
