# Startup smoke test settings, sourced by scripts/smoke-runner.sh.
SMOKE_WAYLAND=true
SMOKE_TIMEOUT=90
SMOKE_DEVTOOLS_PORT=9222
SMOKE_WINDOW_PATTERN='top-level window .* of termius,'
# Termius refuses to start when $SHELL is unset (it records the shell path for
# its shell integration), and the smoke runner launches the app from a bare
# environment. Real sessions always have it.
SMOKE_CMD=(
  env SHELL=/bin/bash
  termius
  --no-sandbox
  --disable-gpu
  --disable-dev-shm-usage
  --ozone-platform=wayland
  --remote-debugging-port=9222
  --enable-logging=file
  --log-file="$SMOKE_LOG_DIR/chrome.log"
)
