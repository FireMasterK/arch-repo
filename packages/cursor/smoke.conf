# Startup smoke test settings, sourced by scripts/smoke-runner.sh.
SMOKE_WAYLAND=true
SMOKE_TIMEOUT=90
SMOKE_DEVTOOLS_PORT=9222
SMOKE_WINDOW_PATTERN='top-level window .* of cursor,'
SMOKE_PROCESS_PATTERN='resources/app/cursor.mjs'
SMOKE_CMD=(
  cursor
  --no-sandbox
  --disable-gpu
  --disable-dev-shm-usage
  --ozone-platform=wayland
  --remote-debugging-port=9222
  --enable-logging=file
  --log-file="$SMOKE_LOG_DIR/chrome.log"
)
